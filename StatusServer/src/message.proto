syntax = "proto3";

// 包名：验证码服务相关协议
package message;

// 验证码服务：提供邮箱验证码获取功能
service VarifyService {
  // 获取邮箱验证码
  rpc GetVarifyCode (GetVarifyReq) returns (GetVarifyRsp) {}
}

// 获取验证码请求
message GetVarifyReq {
  // 目标邮箱地址
  string email = 1;
}

// 获取验证码响应
message GetVarifyRsp {
  // = 1/2/3 是 protobuf 的字段标签号，用于序列化协议，不是普通赋值

  // 错误码：0=成功，非0=失败
  int32 error = 1;
  // 接收验证码的邮箱
  string email = 2;
  // 生成的验证码
  string code = 3;
}

// 获取聊天服务器请求
message GetChatServerReq {
  int32 uid = 1;
}

// 获取聊天服务器响应
message GetChatServerRsp {
  int32 error = 1;
  string host = 2;
  string port = 3;
  string token = 4;
}

service StatusService {
  rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
}
